name: Pubblica su GitHub Pages

# Copia solo i file della pagina nel branch gh-pages, da cui GitHub Pages serve il sito.
# Parte quando cambiano la pagina o i dati generati da build_data.py.
on:
  push:
    branches: [main, claude/scuole-allarme-bomba-dashboard-xyieta]
    paths:
      - index.html
      - data/scuole.json
      - data/province.topojson
      - vendor/**
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir -p _site/data
          cp -r index.html vendor _site/
          cp data/scuole.json data/province.topojson _site/data/
          touch _site/.nojekyll

      - name: Pubblica nel branch gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pubblica da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
